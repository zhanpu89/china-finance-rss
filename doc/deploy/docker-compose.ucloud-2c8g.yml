# UCloud 2C8G — 主节点（下游同机房）
# 压测基线：MAX_WORKERS=30/MAX_INFLIGHT=60，300并发 180 qps，CPU 86%
# 角色：Nginx sticky 粘性目标节点，承载全部 SSE 连接 + 大半 REST 流量
#
# 运行时调优（2026-09-20 专项 · A/B 已证实；证据见下方 environment 段注释）：
#   MALLOC_ARENA_MAX=2         PRF-MEM-02   python VmRSS −248MiB，容器 1.41→1.259GiB
#   HTTP_POOL_MAX_PER_HOST=48  PRF-LAT-01   fundflow avg −52%、basic_info −25%
#
# 启动：
#   docker compose -f doc/deploy/docker-compose.ucloud-2c8g.yml up -d --build
#
# nginx 注意：
#   upstream finsse { ip_hash; server UCloud:8054 weight=2; server Ali:8054 weight=1; }
#   location /stream/ { proxy_read_timeout 3600s; proxy_buffering off; }
#
services:
  rss:
    build:
      context: ../..          # 从 doc/deploy/ 指向 repo 根目录
      dockerfile: Dockerfile
    container_name: china-finance-rss
    restart: unless-stopped
    ports:
      - "8053:8053"     # REST
      - "8054:8054"     # SSE
    environment:
      - PORT=8053
      # ── 准入控制（8G 内存宽裕，IO 为主 GIL 争用可忽略）────
      - MAX_WORKERS=30                # 2核 + 8G，IO bound 场景下 30 workers 实测稳定
                                      # （压测：100并发 503≈0%，15s 超时边界更宽松）
      - MAX_INFLIGHT=60               # = 2× MAX_WORKERS
      # ── CDP 浏览器池（内存充裕）────────────────────────────
      - CDP_STOCK_PAGES=5             # 总内存 8GB 分区：本服务 3GB + 其他应用 5GB；口径见 SAD §4.3：
                                      # 每页 PSS 典型 60MB / RSS 172MB，另加固定基线 250MB(PSS，含
                                      # Omnibox webui ≈91MB)；5 stock + 2 常驻(finance/quotation) =
                                      # 7 内容页 ⇒ 典型 ≈670MB / 保守 ≈1300MB，留足 Python 堆栈余量
      - CDP_RESTART_INTERVAL=7200
      # ── HTTP 压缩 ──────────────────────────────────────────
      - GZIP_MIN_BYTES=1024
      - GZIP_COMPRESSLEVEL=1          # 统一速度优先（2核最优，8核可调回 6）
      # ── SSE ──────────────────────────────────────────────
      - STREAM_HOST=0.0.0.0
      - REQUEST_TIMEOUT=10
      # ── 日志 ──────────────────────────────────────────────
      - LOG_DIR=/app/logs
      - LOG_BACKUP_DAYS=30
      # ── 内存（PRF-MEM-02，A/B 已证实）──────────────────────
      # glibc per-thread arena 上限。默认最多 8×ncores 个 64MB arena，分配后
      # 长期不归还 OS ⇒ 碎片（RssAnon 占 98%、RssFile 仅 14.5MB）。
      # A/B 实测（压测 run 20260920-113125）：python VmRSS 1.008GiB→0.772GiB
      # （−248MiB）、VmSize 8.96GB→1.15GB、匿名 rw-p 映射 300→166、
      # 容器稳态 1.41GiB(93.98%)→1.259GiB(83.95%)。
      # 本节点 8G 内存宽松、碎片不构成风险，但机制与线程数正相关（30 worker +
      # CDP + stream 线程更多 ⇒ arena 更多），收益为内存卫生（VmSize 虚高消除）
      # 且无实测回退；如出现异常可在本行单独回退。
      # 见 SAD §7.2 AR-18 / §9.17（tech-stack.json infrastructure.deployment）。
      - MALLOC_ARENA_MAX=2
      # ── 上游连接池（PRF-LAT-01，A/B 已证实）────────────────
      # 每 (scheme,host,port) keep-alive 池上限。默认 24 在高并发下成为排队
      # 瓶颈（30 worker × fan-out 抢连接）。实测（run 20260920-142456，基线
      # run 20260920-140901）：fundflow tier1000 avg 3.00→1.43s（−52%）、
      # basic_info 4.08→3.08s（−25%）、ok_rate 100%，内存无变化。
      # 取 48（=已实证值）满足：
      #   ① 池 ≥ BATCH_MAX_WORKERS(=20)：批扇出不排队在池上（硬约束，改其一须
      #      连带核另一；BUG-SSE-DEPTH-01 / SAD AR-14）；
      #   ② 池 ≥ MAX_WORKERS(=30)，每个 worker 至少一条专属连接。
      # ⚠ 本节点 MAX_INFLIGHT=60 > 48，超出部分按设计走 ephemeral 短连接
      #   （不排队、不阻塞，仅多一次握手）；若要完全覆盖在飞快照可升到 60
      #   （= MAX_INFLIGHT），但**需先核上游在 60 并发下是否限流并单独 A/B**，
      #   故本次不取。
      # 注意：timeline 尾延迟未改善——由上游/CPU（单码 ~96KB JSON 解析）支配、
      # 非连接池，属已知容量边界（_PROGRESS.md B-7 / SAD §4.2）。
      - HTTP_POOL_MAX_PER_HOST=48
    volumes:
      - ../../data:/app/data
      - ../../logs:/app/logs
    mem_limit: 3g                     # 8GB 总内存，给 OS 留 2GB（文件页缓存 + CDP 子进程）
    mem_reservation: 256M
    dns:
      # 国内解析器优先：223.5.5.5 实测 14ms；原首选 8.8.8.8 为 170ms 且
      # 5.5% 概率触发 ~4s 重试（保留为最后兜底，勿置首）。
      - 223.5.5.5
      - 223.6.6.6
      - 8.8.8.8
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
