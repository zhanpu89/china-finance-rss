services:
  rss:
    build: .
    container_name: china-finance-rss
    restart: unless-stopped
    ports:
      - "8053:8053"
      - "8054:8054"
    environment:
      - PORT=8053
      - REQUEST_TIMEOUT=10
      - MAX_WORKERS=20
      - MAX_INFLIGHT=40
      - PUBLIC_BASE_URL=
      - CDP_STOCK_PAGES=4
      - STREAM_HOST=0.0.0.0
      - CDP_RESTART_INTERVAL=7200
      # ── HTTP 压缩（跨公网带宽节省）───────────────────────
      - GZIP_MIN_BYTES=1024
      - GZIP_COMPRESSLEVEL=1
      - LOG_DIR=/app/logs
      - LOG_BACKUP_DAYS=30
      # ── 内存（PRF-MEM-02，A/B 已证实）──────────────────────
      # glibc per-thread arena 上限。33 线程下默认最多 8×ncores 个 64MB arena，
      # 分配后长期不归还 → 碎片。A/B 实测（压测 run 20260920-113125）：
      # python VmRSS 1.008GiB→0.772GiB（−248MiB）、VmSize 8.96GB→1.15GB、
      # 匿名 rw-p 映射 300→166、容器稳态 1.41GiB(93.98%)→1.259GiB(83.95%)。
      # 见 SAD §7.2 AR-18 / §9.17。
      - MALLOC_ARENA_MAX=2
      # PRF-LAT-01（A/B 已证实）：连接池上限。默认 24 在高并发下成为排队瓶颈
      # （20 客户端 × 20 worker 抢连接）。提到 48 后实测（压测 run 20260920-142456）：
      # fundflow tier1000 avg 3.00→1.43s（−52%）、basic_info 4.08→3.08s（−25%）、
      # ok_rate 100%（三次运行中最佳），且内存无变化。
      # 注意：timeline 仍 12.1s/24.6s 未改善——其尾延迟由上游/CPU（单码 96KB JSON
      # 解析）而非连接池支配，属已知容量边界（AC-E2 在合成 tier1000 极端负载下超线）。
      - HTTP_POOL_MAX_PER_HOST=48
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    mem_limit: 1.5g
    mem_reservation: 256M
    dns:
      # 国内解析器优先：223.5.5.5 实测 14ms；原首选 8.8.8.8 为 170ms 且
      # 5.5% 概率触发 ~4s 重试（保留为最后兜底，勿置首）。
      - 223.5.5.5
      - 223.6.6.6
      - 8.8.8.8
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
