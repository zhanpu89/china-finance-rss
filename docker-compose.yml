services:
  rss:
    build: .
    container_name: china-finance-rss
    restart: unless-stopped
    ports:
      - "8053:8053"
    environment:
      - PORT=8053
      - CACHE_TTL=300
      - REQUEST_TIMEOUT=10
      - MAX_WORKERS=10
      - PUBLIC_BASE_URL=
      - CDP_STOCK_PAGES=3
      - CDP_RESTART_INTERVAL=7200
      - LOG_DIR=/app/logs
      - LOG_BACKUP_DAYS=30
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    mem_limit: 2g
    mem_reservation: 256M
    dns:
      - 8.8.8.8
      - 223.5.5.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
